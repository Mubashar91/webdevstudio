<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, meta, Open Graph, canonical and JSON-LD are injected here at build
      time by the seoHead() plugin in vite.config.ts, from src/lib/site.config.mjs.
      scripts/prerender.mjs then rewrites them per route into dist/<route>/index.html.
      Do not hand-edit those tags — edit site.config.mjs instead.
    -->
    <!--seo-head-->

    <meta name="author" content="Muhammad Mubashar Shahzad" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="twitter:site" content="@mubashardev" />
    <meta name="twitter:creator" content="@mubashardev" />

    <!-- Google Search Console ownership verification.
         Static (not generated) so prerender.mjs copies it to every route —
         Google only checks the homepage, but leaving it sitewide means
         re-verification keeps working if the verified URL ever changes.
         Do not remove: deleting it un-verifies the property. -->
    <meta
      name="google-site-verification"
      content="pFterQN1G5H_UPC95RtATtrigdx92LtU8futA4a8Wp0"
    />

    <!-- ── Favicon & PWA ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Fonts ──
         Loaded non-blocking: the stylesheet is fetched as a low-priority
         preload and promoted to a stylesheet on load, so it no longer sits in
         the critical path delaying first paint. The <noscript> copy keeps it
         working without JS. font-display:swap (in the &display=swap param)
         means text paints immediately in the fallback face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      data-font-preload
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      />
    </noscript>

    <!-- Analytics and font activation run from src/lib/boot.ts, not inline
         scripts, so the CSP can drop script-src 'unsafe-inline'. -->

    <!-- ── Performance hints ── -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>

  <body>
    <div id="root"></div>

    <!--
      No hardcoded fallback copy here.

      This block previously contained a static top-level heading, and because prerender.mjs
      copies this same template to every route, all 8 pages shipped an
      identical H1 in their raw HTML. scripts/prerender.mjs now injects the
      real server-rendered page — including that route's own H1 — into #root
      above, so a no-JS fetch already receives the genuine content.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
