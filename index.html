<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, meta, Open Graph, canonical and JSON-LD are injected here at build
      time by the seoHead() plugin in vite.config.ts, from src/lib/site.config.mjs.
      scripts/prerender.mjs then rewrites them per route into dist/<route>/index.html.
      Do not hand-edit those tags — edit site.config.mjs instead.
    -->
    <!--seo-head-->

    <meta name="author" content="Muhammad Mubashar Shahzad" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="twitter:site" content="@mubashardev" />
    <meta name="twitter:creator" content="@mubashardev" />

    <!-- ── Favicon & PWA ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Fonts ──
         Loaded non-blocking: the stylesheet is fetched as a low-priority
         preload and promoted to a stylesheet on load, so it no longer sits in
         the critical path delaying first paint. The <noscript> copy keeps it
         working without JS. font-display:swap (in the &display=swap param)
         means text paints immediately in the fallback face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      />
    </noscript>

    <!-- ── Performance hints ── -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>

  <body>
    <div id="root"></div>

    <!--
      Fallback copy for crawlers and users without JavaScript. Prerendered
      <head> tags cover metadata; this covers the visible content contract so a
      no-JS fetch is never a blank page.
    -->
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>WebDevStudio — React &amp; MERN Web Development</h1>
        <p>
          WebDevStudio builds fast, conversion-focused React, TypeScript and
          MERN stack web applications for businesses worldwide, led by
          Muhammad Mubashar Shahzad.
        </p>
        <p>
          This site needs JavaScript for the full experience. To get in touch
          directly, email
          <a href="mailto:mmubasharshahzad40@gmail.com">mmubasharshahzad40@gmail.com</a>
          or call <a href="tel:+923096403160">+92 309 6403160</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
